
name: GUNX SMART NBA APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build GUNX SMART NBA
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            rustc \
            cargo

      - name: Install Python build dependencies
        run: |
          python --version

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            legacy-cgi \
            "Cython==0.29.34"

      - name: Install Buildozer
        run: |
          python -m pip install \
            git+https://github.com/kivy/buildozer.git

      - name: Verify build environment
        run: |
          python --version
          python -m pip --version
          java -version
          buildozer --version

      - name: Test NBA Engine
        run: |
          python nba_test.py

      - name: Test NBA Integration
        run: |
          python nba_integration_test.py

      - name: Test NBA Live Data
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python nba_live_test.py

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p apk-artifacts

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          echo "SEARCHING FOR GUNX SMART NBA APK"

          find . -type f -name "*.apk" \
            -not -path "./apk-artifacts/*" \
            -print

          find . -type f -name "*.apk" \
            -not -path "./apk-artifacts/*" \
            -exec cp {} apk-artifacts/ \;

          if ! compgen -G "apk-artifacts/*.apk" > /dev/null; then
            echo "ERROR: APK NOT FOUND"

            ls -lah bin/ || true
            ls -lah .buildozer/ || true

            exit 1
          fi

          echo "APK GENERATED SUCCESSFULLY"

          ls -lh apk-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-SMART-NBA-APK
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-SMART-NBA-Build-Log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
