
name: GUNX SMART NBA APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git zip unzip \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check build environment
        run: |
          python --version
          java -version
          buildozer --version

      - name: Test NBA Engine
        run: python nba_test.py

      - name: Test NBA Integration
        run: python nba_integration_test.py

      - name: Test NBA Live Data
        continue-on-error: true
        timeout-minutes: 10
        run: python nba_live_test.py

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find . -type f -name "*.apk" -print

          mkdir -p apk-artifacts

          find . -type f -name "*.apk" \
            -not -path "./apk-artifacts/*" \
            -exec cp -t apk-artifacts {} +

          if ! ls apk-artifacts/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK was generated!"
            echo "Checking bin directory..."
            ls -lah bin/ || true
            echo "Checking Buildozer directory..."
            ls -lah .buildozer/ || true
            exit 1
          fi

          echo "APK FOUND SUCCESSFULLY!"
          ls -lh apk-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-SMART-NBA-APK
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-SMART-NBA-Build-Log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
