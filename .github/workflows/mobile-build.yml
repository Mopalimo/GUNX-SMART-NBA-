name: Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/react-native-dashboard
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build SMART NBA standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Limit APK to Android ARM architectures
        working-directory: mobile/android
        run: echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> gradle.properties

      - name: Build standalone release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Verify JavaScript bundle is packaged
        working-directory: mobile/android
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-SMART-NBA-Standalone-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
